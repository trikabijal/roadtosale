name: JustTalk
options:
  bundleIdPrefix: com.trika
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  xcodeVersion: "16"
  createIntermediateGroups: true

packages:
  DictationCore:
    path: Shared
  # Note: GRDB and WhisperKit are resolved transitively through DictationCore

targets:

  JustTalk:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: JustTalk
    resources:
      - path: JustTalk/Assets.xcassets
    dependencies:
      - package: DictationCore
    entitlements:
      path: JustTalk/JustTalk.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trika.justtalk.mac
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # Stable signing so macOS TCC persists Mic / Accessibility / Input Monitoring grants
        # across rebuilds. Ad-hoc signing changes identity every build, which made macOS
        # forget permissions and re-prompt on every launch. Manual + the local Apple
        # Development cert keeps the designated requirement (team + bundle id) stable.
        CODE_SIGN_STYLE: Manual
        # SHA-1 of the local "Apple Development: bijalsanghavi@hotmail.com (2TZPM5QG3Z)" cert.
        # The generic "Apple Development" alias does not resolve here (xcodebuild defaults to
        # "Mac Development"), so the hash is pinned. If the cert is renewed/replaced, update
        # this to the new SHA-1 from: security find-identity -v -p codesigning
        CODE_SIGN_IDENTITY: FE397482F391750DFEB077FCBFEDA8841C50ED0C
        DEVELOPMENT_TEAM: 2TZPM5QG3Z
        PROVISIONING_PROFILE_SPECIFIER: ""
        INFOPLIST_FILE: JustTalk/Info.plist
        CODE_SIGN_ENTITLEMENTS: JustTalk/JustTalk.entitlements
        # No dock icon — menu bar app
        LSUIElement: YES
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    info:
      path: JustTalk/Info.plist
      properties:
        CFBundleName: Just Talk
        CFBundleDisplayName: Just Talk
        NSMicrophoneUsageDescription: "Just Talk uses the microphone to record your voice for transcription. Audio never leaves your Mac."
        NSAppleEventsUsageDescription: "Just Talk sends keyboard events to paste transcribed text into the app you're using."
        LSUIElement: true
        # OS-level guard: LaunchServices won't launch a second instance of this bundle. Backed up
        # by a process-wide file lock in AppDelegate, which also catches a differently-signed copy.
        LSMultipleInstancesProhibited: true
    scheme:
      testTargets:
        - JustTalkTests

  JustTalkTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: JustTalkTests
    dependencies:
      - target: JustTalk
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.trika.justtalk.mac.tests

  DictationKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DictationKeyboard
    entitlements:
      path: DictationKeyboard/DictationKeyboard.entitlements
      # Declared here so `xcodegen generate` regenerates the file WITH the App
      # Group instead of wiping it to an empty <dict/> (shared storage between
      # the keyboard extension and its container app).
      properties:
        com.apple.security.application-groups:
          - group.com.trika.dictation
    settings:
      base:
        # Must be prefixed by the container app's id (com.trika.dictation.ios) — an
        # app-extension's bundle id has to be a child of its host app's.
        PRODUCT_BUNDLE_IDENTIFIER: com.trika.justtalk.ios.keyboard
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: BMRZ94XB47
        INFOPLIST_FILE: DictationKeyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: DictationKeyboard/DictationKeyboard.entitlements
    info:
      path: DictationKeyboard/Info.plist
      properties:
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-input-mode
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
        CFBundleDisplayName: Just Talk
        NSMicrophoneUsageDescription: "Just Talk uses the microphone to transcribe your speech on-device."

  DictationContainerApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DictationContainerApp
    resources:
      - path: DictationContainerApp/Assets.xcassets
    dependencies:
      - package: DictationCore
      - target: DictationKeyboard
        embed: true
    entitlements:
      path: DictationContainerApp/DictationContainerApp.entitlements
      # Declared here so `xcodegen generate` regenerates the file WITH the App
      # Group instead of wiping it (shared storage with the keyboard extension).
      properties:
        com.apple.security.application-groups:
          - group.com.trika.dictation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trika.justtalk.ios
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: BMRZ94XB47
        INFOPLIST_FILE: DictationContainerApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: DictationContainerApp/DictationContainerApp.entitlements
    info:
      path: DictationContainerApp/Info.plist
      properties:
        CFBundleName: Just Talk
        CFBundleDisplayName: Just Talk
        NSMicrophoneUsageDescription: "Just Talk uses the microphone to transcribe your speech on-device."
        UILaunchScreen:
          UIColorName: ""
    scheme:
      testTargets: []
