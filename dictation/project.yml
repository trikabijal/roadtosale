name: JustTalk
options:
  bundleIdPrefix: com.trika
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  xcodeVersion: "16"
  createIntermediateGroups: true

packages:
  DictationCore:
    path: Shared
  # Note: GRDB and WhisperKit are resolved transitively through DictationCore

targets:

  JustTalk:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: JustTalk
    resources:
      - path: JustTalk/Assets.xcassets
    dependencies:
      - package: DictationCore
    entitlements:
      path: JustTalk/JustTalk.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trika.justtalk.mac
        # Product/app name shown to the user (menu bar, permission dialogs, .app filename). The
        # Xcode target/scheme stays "JustTalk" (internal); the bundle id is unchanged so TCC grants
        # persist across the rename.
        PRODUCT_NAME: "Just Talk"
        # Keep the Swift MODULE name "JustTalk" — PRODUCT_NAME's space would otherwise make it
        # "Just_Talk" and break `@testable import JustTalk` in the tests.
        PRODUCT_MODULE_NAME: JustTalk
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # Stable signing so macOS TCC persists Mic / Accessibility / Input Monitoring grants
        # across rebuilds. Ad-hoc signing changes identity every build, which made macOS
        # forget permissions and re-prompt on every launch. Manual + the local Apple
        # Development cert keeps the designated requirement (team + bundle id) stable.
        CODE_SIGN_STYLE: Manual
        # SHA-1 of the local "Apple Development: bijalsanghavi@hotmail.com (2TZPM5QG3Z)" cert.
        # The generic "Apple Development" alias does not resolve here (xcodebuild defaults to
        # "Mac Development"), so the hash is pinned. If the cert is renewed/replaced, update
        # this to the new SHA-1 from: security find-identity -v -p codesigning
        CODE_SIGN_IDENTITY: FE397482F391750DFEB077FCBFEDA8841C50ED0C
        DEVELOPMENT_TEAM: 2TZPM5QG3Z
        PROVISIONING_PROFILE_SPECIFIER: ""
        INFOPLIST_FILE: JustTalk/Info.plist
        CODE_SIGN_ENTITLEMENTS: JustTalk/JustTalk.entitlements
        # No dock icon — menu bar app
        LSUIElement: YES
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    info:
      path: JustTalk/Info.plist
      properties:
        CFBundleName: Just Talk
        CFBundleDisplayName: Just Talk
        NSMicrophoneUsageDescription: "Just Talk uses the microphone to record your voice for transcription. Audio never leaves your Mac."
        # Speech Recognition is requested ONLY if the user switches to the Apple on-device provider
        # (SpeechAnalyzer requires it). The default WhisperKit provider needs no Speech permission —
        # so a fresh install asks only Microphone + Accessibility + Input Monitoring, matching Wispr.
        NSSpeechRecognitionUsageDescription: "Just Talk uses Apple's on-device speech recognizer to transcribe your voice. Audio never leaves your Mac."
        # Optional install-signal endpoint. When set, the onboarding "stay in touch" step POSTs the
        # user's (explicitly entered) name/email/phone here so we know someone installed. Empty = no-op;
        # voice/audio NEVER go here — only the contact the user typed. Set to a Google Apps Script
        # web-app URL (see docs/install-ping.md).
        JustTalkInstallPingURL: ""
        LSUIElement: true
        # OS-level guard: LaunchServices won't launch a second instance of this bundle. Backed up
        # by a process-wide file lock in AppDelegate, which also catches a differently-signed copy.
        LSMultipleInstancesProhibited: true
    scheme:
      testTargets:
        - JustTalkTests

  JustTalkTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: JustTalkTests
    dependencies:
      - target: JustTalk
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.trika.justtalk.mac.tests
        # The host app's product is "Just Talk.app" (PRODUCT_NAME has a space); pin TEST_HOST /
        # BUNDLE_LOADER to it, otherwise xcodegen derives them from the target name "JustTalk" and
        # the test host can't be found.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Just Talk.app/Contents/MacOS/Just Talk"
        BUNDLE_LOADER: "$(TEST_HOST)"

  DictationKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DictationKeyboard
    dependencies:
      - package: DictationCore
        product: DictationCoreBase
    entitlements:
      path: DictationKeyboard/DictationKeyboard.entitlements
      properties: {}
    settings:
      base:
        # Must be prefixed by the container app's id (com.trika.dictation.ios) — an
        # app-extension's bundle id has to be a child of its host app's.
        PRODUCT_BUNDLE_IDENTIFIER: com.trishashah.justtalk.ios.keyboard
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: DictationKeyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: DictationKeyboard/DictationKeyboard.entitlements
    info:
      path: DictationKeyboard/Info.plist
      properties:
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-input-mode
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
        CFBundleDisplayName: Just Talk
        NSMicrophoneUsageDescription: "Just Talk uses the microphone to transcribe your speech on-device."

  DictationContainerApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DictationContainerApp
    resources:
      - path: DictationContainerApp/Assets.xcassets
    dependencies:
      - package: DictationCore
        product: DictationCoreBase
      - target: DictationKeyboard
        embed: true
        link: false
        codeSign: true
    entitlements:
      path: DictationContainerApp/DictationContainerApp.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trishashah.justtalk.ios
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: DictationContainerApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: DictationContainerApp/DictationContainerApp.entitlements
    info:
      path: DictationContainerApp/Info.plist
      properties:
        CFBundleName: Just Talk
        CFBundleDisplayName: Just Talk
        NSMicrophoneUsageDescription: "Just Talk uses the microphone to transcribe your speech on-device."
        NSSpeechRecognitionUsageDescription: "Just Talk uses Apple Speech Recognition to transcribe your voice on-device."
        UILaunchScreen:
          UIColorName: ""
    scheme:
      testTargets: []
