# Source manifest for `voice-lab ingest-youtube`.
#
# Each entry is a public YouTube dealer walkaround / feature-review video.
# All videos here were located via web search and verified to exist as of
# the date this file was authored. Transcripts are pulled with
# `youtube-transcript-api`; YouTube auto-generated transcripts (no human
# captions) are accepted — they are the dominant source for dealer
# channels and quality is good enough for STT evaluation.
#
# Fair use: per PRD OQ13, ingesting public dealer walkaround transcripts
# for internal STT evaluation is acceptable. We never redistribute the
# transcripts or the videos themselves; only the derived script YAML is
# committed, and it is for evaluation use only.
#
# Trim mapping limitations:
#   - Only `honda.cr-v-hybrid-awd.2026.sport-touring`,
#     `honda.cr-v-hybrid-awd.2026.sport-l`, and `honda.cr-v-hybrid-awd.2026.sport`
#     currently exist in vehicle-feature-catalog/data/matrix/honda.yaml.
#   - For models that lack a catalog entry (Civic, Pilot, Accord), we mark
#     the target_trim_id with the closest CR-V trim and flag in `notes`.
#     These rows must be re-mapped once the catalog adds those trims; the
#     orchestrator will surface a mismatch when the trim's feature set
#     doesn't intersect the script's matched feature cues.

sources:
