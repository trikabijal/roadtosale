    target_trim_id: honda.cr-v-hybrid-awd.2026.sport-touring
    notes: TrailSport trim not in catalog; mapping to Sport Touring as the closest hybrid AWD analog.
    fair_use_note: Public dealer walkaround used for internal STT evaluation under fair use.

