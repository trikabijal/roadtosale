[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-lab"
version = "0.1.0"
description = "Voice engine lab — strategy comparison harness for STT engines"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "youtube-transcript-api>=1.0",
    "vehicle-feature-catalog",
    "soundfile>=0.12",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
argmax = [
    "websockets>=12.0",
]
semantic = [
    "fastembed>=0.3",
]
denoise = [
    "denoiser>=0.1",   # Facebook DNS64 neural denoiser (MIT); pulls torch
]

[project.scripts]
voice-lab = "voice_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
