# v1 seed data — verify against authoritative source (NADA Road to Sale + Honda US dealer training) before relying on accuracy.
# Universal workflow cues — brand-agnostic, NOT tied to any vehicle feature.
# These cover the NADA Road to the Sale across all steps. The lab loads these alongside
# feature cues from vehicle-feature-catalog. Categories follow the NADA step taxonomy:
#   greet, discovery, vehicle_match, walkaround, test_drive, trial_close,
#   trade, pencil, manager_to, buyers_order, finance, delivery, follow_up
cues:

  # ─── Greet ─────────────────────────────────────────────────────────────
  - id: workflow.hospitality_offer
    display_name: Hospitality offer (coffee / water / drink)
    category: greet
    cue_phrases:
      - coffee or water
      - water or coffee
      - anything to drink
      - grab you a drink
      - get you something to drink
      - can I get you anything to drink
      - water or coffee before we head
      - grab you a coffee
    synonyms: []
  - id: workflow.self_introduction
    display_name: Rep self-introduction
    category: greet
    cue_phrases:
