      - I'm Marcus
      - I am Marcus
      - this is me
      - welcome to
      - I'll be helping you
      - happy to help you today
    synonyms: []
  - id: workflow.customer_name_use
    display_name: Customer name acknowledgment (rep using customer's first name)
    category: greet
    cue_phrases:
      - Hi Sarah
      - Hi there Sarah
      - good to meet you Sarah
      - thanks for coming in Sarah
      - nice to meet you
    synonyms: []
  - id: workflow.test_drive_offer
