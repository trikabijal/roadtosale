# v1 seed data — verify against authoritative source (Honda US 2026 brochure) before relying on accuracy
# Universal workflow cues — brand-agnostic, NOT tied to any vehicle feature.
# These cues correspond to phases of the Road to the Sale (greet, discovery, vehicle match,
# front-line ready, trade, handoff, finance). They are loaded by the voice-engine lab
# alongside feature cues from the vehicle-feature-catalog.
cues:
  - id: workflow.hospitality_offer
    display_name: Hospitality offer
    category: greet
    cue_phrases:
      - coffee or water
      - water or coffee
      - anything to drink
      - grab you a drink
      - get you something to drink
      - can I get you anything to drink
      - water or coffee before we head
      - grab you a coffee
    synonyms: []
  - id: workflow.self_introduction
    display_name: Rep self-introduction
    category: greet
    cue_phrases:
      - my name is
      - I'm Marcus
      - I am Marcus
      - this is me
      - welcome to
    synonyms: []
  - id: workflow.discovery_school_runs
