# v1 — TTS voice profiles for the ElevenLabs synthesis provider.
#
# Decision (2026-05-22): use the FREE-TIER ElevenLabs voice library (21
# default voices, all American/British/Australian — no labeled regional
# US accents). Regional accent realism is sourced from the YouTube
# ingestion path (real Honda dealer walkarounds) instead, which captures
# Southern/Midwest/Northeast variation naturally.
#
# Net: this TTS matrix tests SPEAKER VARIABILITY (gender, age, energy,
# depth, cadence) against the hand-written scripts. The YouTube fixtures
# test REGIONAL ACCENT variability against real dealer language.
#
# To upgrade to true regional accents from TTS, subscribe to ElevenLabs
# Creator tier (~$22/mo), swap these voice_ids for shared-library picks
# (e.g. Grace=Southern, Evan=Midwest, Jerry B.=Boston, Elliot Quick=fast),
# and re-run `voice-lab synth`.
