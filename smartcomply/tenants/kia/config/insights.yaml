# Kia tenant — AI insight definitions surfaced on the National BI dashboard.
#
# Each entry under `correlations:` is a paired-element co-occurrence query:
# "when a checkpoint matching <left> fails, how often does a checkpoint
# matching <right> also fail in the same audit?". The backend renders the
# `message` template with the computed percentage when the pair has any
# observations.
#
# To add a new tenant: copy this file under tenants/<id>/config/ and edit
# the patterns + message to match that tenant's checksheet vocabulary.
correlations:
  - id: paver_signage
    left:
      elementPattern: '%paver%'
      questionPattern: '%cleanli%'
    right:
      elementPattern: '%signage%'
    message: 'Paver cleanliness and showroom signage failures co-occur in {pct}% of cases — likely a single root cause.'
