# =============================================================================
# Profile: honda
# =============================================================================
# Honda Road to Sale tenant profile. Activate alongside `local` or `uat`
# and always pair with `tenant-data` so the Honda Flyway seeds run:
#
#   SPRING_PROFILES_ACTIVE=local,tenant-data TENANT_ID=honda ./mvnw spring-boot:run
#
# This profile is intentionally minimal — Honda uses the same schema and
# server config as Kia. The only tenant-specific runtime differences are:
#   1. tenant.id resolves to "honda" → Flyway scans db/tenants/honda/
#   2. tenant.config.path resolves to ./tenants → picks up honda/config/
#
# To add Honda-specific insights or feature flags, create:
#   tenants/honda/config/insights.yaml
#   tenants/honda/config/features.yaml
# (validated against tenants/_schema.json on startup)
# =============================================================================

# Explicitly pin tenant.id so this profile can be activated by name
# instead of requiring the TENANT_ID env var at the shell level.
# Shell env var still wins if set (Spring property resolution order).
tenant.id=honda

# AI photo assessment is OFF by default for Honda.
# Enable once S3 bucket + Anthropic key are wired for the Honda environment:
#   ai.photo-assessment.enabled=true
ai.photo-assessment.enabled=false
