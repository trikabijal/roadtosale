spring.datasource.url=jdbc:postgresql://localhost:5432/smartcomply
spring.datasource.username=postgres
spring.datasource.password=root
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1.22
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
app.environmentDomain=http://localhost:8089
# URLs consumed by the shared e2e suite. The SPA build script
# (smartcomply-angular/scripts/load-env.mjs) and the Playwright runner
# read these from the same per-env properties file so a URL only ever
# moves in one place.
app.api.url=http://localhost:8089/api
app.frontend.url=http://localhost:4200
# Bootstrap super-admin the JUnit + Playwright tests log in as before
# creating per-test users. Must exist with role SUPER_ADMIN in the DB
# the active profile points at.
app.test.bootstrap-user=Z006135
aws.access_key_id=local
aws.secret_access_key=local
aws.s3.region=ap-south-1
aws.s3.bucket=local-bucket
mail.from=local@example.com
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Local file storage — earlier seed runs wrote photos to data/uploads/ when
