# =============================================================================
# Profile: tenant-data
# =============================================================================
# Opt-in Flyway profile that adds tenant-specific seed data on top of the
# universal schema. Activate alongside another profile, never alone:
#
#   # Local dev that wants kia users + dealerships seeded
#   SPRING_PROFILES_ACTIVE=local,tenant-data TENANT_ID=kia ./mvnw spring-boot:run
#
#   # UAT (auto — application-uat.properties includes this profile)
#   SPRING_PROFILES_ACTIVE=uat
#
# Without this profile active, Flyway runs universal schema only — clean
# DB, no demo users, no dealerships. The default for local development.
#
# When activating, ${tenant.id} resolves from the TENANT_ID env var (or
# the default `kia` set in application.properties) and Flyway scans
# classpath:db/tenants/<tenant.id>/V100.x__*.sql.

spring.flyway.locations=classpath:db/migration,classpath:db/tenants/${tenant.id}
