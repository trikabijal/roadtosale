#================================
# Active profile is selected at deploy/run time via the
# SPRING_PROFILES_ACTIVE env var (or -Dspring.profiles.active).
# Devops deploy stage sets SPRING_PROFILES_ACTIVE=uat; local devs
# set their own (e.g., =local).
#================================

#================================
# Database driver and schema (env-agnostic)
#================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.default_schema=public

#================================
# JPA / Hibernate (env-agnostic)
#================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.current_session_context_class=org.springframework.orm.hibernate5.SpringSessionContext
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

#================================
# Server
#================================
server.port=8089

#================================
# Tenant overlay
#================================
# Selects which tenants/<id>/config/insights.yaml the BI dashboard's
# AI insight callout reads from. Override per environment via env vars
# TENANT_ID (e.g. kia, default, ford) and TENANT_CONFIG_PATH.
tenant.id=${TENANT_ID:kia}
tenant.config.path=${TENANT_CONFIG_PATH:./tenants}

# Flyway runs universal schema migrations only by default. Tenant-specific
# seed data (db/tenants/<id>/V100.x) is opt-in via the `tenant-data`
# profile — see application-tenant-data.properties. UAT auto-includes
# that profile via the profile group below, so the deployed kia demo
# stays seeded; local devs work on an empty schema unless they
# explicitly turn it on with SPRING_PROFILES_ACTIVE=local,tenant-data.
spring.flyway.locations=classpath:db/migration

# Profile groups — activating `uat` also activates `tenant-data`. This
# keeps the deploy command unchanged (SPRING_PROFILES_ACTIVE=uat) while
# making the dev default a clean schema with no surprise seed data.
spring.profiles.group.uat=tenant-data

#================================
# AI vision provider (env-agnostic default)
# LlmConfig binds with @ConfigurationProperties(prefix = "ai.vision"),
# so any provider/budget overrides must use this prefix.
# Default = Google Gemini Flash (the only provider we currently fund).
# Profiles can override (e.g. application-local.properties).
# AI is OFF by default; only takes effect when a profile sets
# ai.photo-assessment.enabled=true.
#================================
ai.vision.active-provider=GOOGLE_GEMINI

#================================
# JWT / OTP token policy (env-agnostic)
#================================
application.security.jwt.expiration=10000000
application.security.jwt.refresh-token.expiration=100000000
app.jwtRefreshTokenExpiration=200000000
app.jwtTokenExpiration=100000
app.otpExpiration=300

#================================
# Flyway (driven by datasource vars from the env-specific file)
#================================
spring.flyway.enabled=true
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}
spring.flyway.schemas=${spring.jpa.properties.hibernate.default_schema}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=false
# Out-of-order required because tenant migrations (V100.x in db/tenants/<id>/)
# run alongside universal migrations (V1.x in db/migration/). A new V1.x
# landing after V100.002 has already run would otherwise be rejected as
# "older than current". Out-of-order lets V1.27 apply on a DB that's already
# at 100.002.
spring.flyway.out-of-order=true
# spring.flyway.locations is set above with tenant-aware list — DO NOT
# add another locations property here; the last one wins and silently
# overrides the tenant scan.

#================================
# Mail SMTP transport (env-agnostic; credentials in env-specific file)
#================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=true

audit.mail.cc.user=
audit.mail.bcc.user=

#================================
# AWS region (env-agnostic; credentials + bucket in env-specific file)
#================================
aws.s3.region=ap-south-1

#================================
# File storage (path inside container)
#================================
file.uploadDir=/SMARTCOMPLY/

#================================
# Feature flags
#================================
is_email_send=true
is_notification_send=true
is_API_log_save=true

#================================
# Multipart upload limits
#================================
# Hard cap enforced at the multipart parser layer — Spring rejects oversized
# requests before they're buffered to disk/memory. Keep the per-file ceiling
# in sync with app.upload.max-size-mb below (parser limit slightly higher to
# guarantee the service-layer check is the one that returns the friendly
# error message rather than the parser failing first).
spring.servlet.multipart.max-file-size=11MB
spring.servlet.multipart.max-request-size=12MB

#================================
# Application-level upload validation (enforced in service layer)
#================================
# Per-file size limit in MB; service rejects with 413 if exceeded.
app.upload.max-size-mb=10
# Comma-separated MIME whitelist; service rejects with 415 if not matched.
app.upload.allowed-content-types=image/jpeg,image/png,image/webp
