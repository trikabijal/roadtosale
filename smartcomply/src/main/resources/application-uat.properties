# creating per-test users. Must exist with role SUPER_ADMIN in the UAT DB.
app.test.bootstrap-user=Z006135

#================================
# AI photo assessment (ON for UAT)
# Provider keys (ANTHROPIC_KEY/OPENAI_KEY/GEMINI_KEY/GROK_KEY) come
# from masked GitLab CI variables, injected by the deploy stage's
# docker run -e flags. Keys missing → startup warns, app boots.
#================================
ai.photo-assessment.enabled=true
# LlmConfig binds with @ConfigurationProperties(prefix = "ai.vision"),
# NOT "llm" — keys here must use the ai.vision.* prefix to take effect,
# otherwise Spring silently ignores them and the LLM module falls back
# to its default provider (Anthropic).
ai.vision.active-provider=GOOGLE_GEMINI
ai.vision.benchmark-enabled=false
ai.vision.max-spend-usd=10.00
ai.vision.max-calls=1000
