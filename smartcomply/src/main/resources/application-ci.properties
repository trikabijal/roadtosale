#================================
# CI profile — ephemeral database, no Kia tenant data.
#
# Designed to run against a CI database (default name smartcomply_ci) on
# the same Postgres instance as UAT, or local. The test runner
# (dev/scripts/test-ci.sh) drops + recreates this DB before each run,
# applies Flyway migrations (V1.x + V200.x), then runs the test suites.
# The runner drops the DB again on success; leaves it on failure for debug.
#
# Env-agnostic config (Postgres driver, JPA dialect, etc.) inherits from
# application.properties. DB host/credentials are env-driven so the same
# profile works on a dev box and on a CI runner without code change.
#================================

#================================
# Database — env vars with sensible local defaults
#================================
spring.datasource.url=jdbc:postgresql://${CI_DB_HOST:localhost}:${CI_DB_PORT:5432}/${CI_DB_NAME:smartcomply_ci}
spring.datasource.username=${CI_DB_USERNAME:${USER}}
spring.datasource.password=${CI_DB_PASSWORD:}
# Cap HikariCP at 4 connections (default is 10). The
# smartcomply_ci_user Postgres role has CONNECTION LIMIT 10 on the
# UAT Postgres; with 4 Playwright workers each spawning psql for
# loadQuestionIdsForChecksheet, the prior 10-conn HikariCP plus
# 4 worker psql connections totalled 14 → role rejected the
# overflow with "too many connections for role smartcomply_ci_user".
# Capping the pool keeps the test backend within the limit.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1

#================================
# Schema + data are populated by dev/scripts/test-ci.sh BEFORE Spring
# starts (DROP DATABASE → CREATE → restore baseline.sql.gz → seed
# ci_admin). Spring itself is purely a test-driver here:
#   - Hibernate fills in any tables the running entity set declares
#     that the baseline didn't ship (ddl-auto=update). This matches
#     application-local + application-uat behaviour — once an entity
#     is added in code, every environment's Hibernate creates the
#     missing table on next boot. Catching baseline-vs-entity drift
#     with ddl-auto=validate was too brittle: the baseline is dumped
#     periodically from local, the team adds entities continuously,
#     and the lag would fail CI every time.
#   - Flyway is disabled — the dump already carries flyway_schema_history,
#     and re-running migrations would double-up.
#================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.flyway.enabled=false

#================================
# Mail — disabled for CI (suite seeds users that trigger welcome emails;
# we don't need them flying out). Pointing at a non-existent SMTP host
# makes the async send fail fast; tests already swallow that exception.
#================================
spring.mail.host=localhost.invalid
spring.mail.port=25
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false

#================================
# AWS — stub creds, no real bucket. Photo upload tests use the local
# file storage path so they don't need S3.
#================================
aws.access_key_id=ci
aws.secret_access_key=ci
aws.s3.region=ap-south-1
aws.s3.bucket=ci-bucket

file.uploadDir=/tmp/smartcomply-ci-uploads/

#================================
# Public URL — used by emails / links the app generates. Doesn't affect
# tests (they call the test JVM's random port directly), but harmless to
# set to localhost.
#================================
app.protocol=http
app.environmentDomain=http://localhost:8089

#================================
# URLs consumed by the shared e2e suite. Same shape as local/uat — the
# Playwright wrapper reads these via load-env.mjs when running with
# --env ci. For backend JUnit, only app.test.bootstrap-user is consumed.
#================================
app.api.url=http://localhost:8089/api
app.frontend.url=http://localhost:4200
# Matches the username seeded by db/ci/V200.001__ci_bootstrap.sql.
app.test.bootstrap-user=ci_admin
