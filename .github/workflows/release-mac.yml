name: Release Mac (Just Talk)

# Every merge into `development` that touches the macOS app rebuilds, signs, notarizes, and
# publishes the DMG to the fixed `mac-latest` GitHub Release. The website download button links to
# the release's stable asset URL, so it always serves the newest development build with no manual step:
#
#   https://github.com/trikabijal/roadtosale/releases/download/mac-latest/JustTalk.dmg
#
# One-time setup: add the repo secrets listed in dictation/docs/deploy-mac-ci.md.
# Manual re-run: Actions ▸ "Release Mac (Just Talk)" ▸ Run workflow (workflow_dispatch).

on:
  push:
    branches: [development]
    paths:
      - "dictation/**"
      - ".github/workflows/release-mac.yml"
  workflow_dispatch:

concurrency:
  group: release-mac
  cancel-in-progress: true

permissions:
  contents: write # create/replace the mac-latest release

jobs:
  build:
    # macOS 26 SDK is required (SpeechAnalyzer / Foundation Models are macOS 26 APIs). If this runner
    # image lacks Xcode 26, switch the label to `macos-26`. The "Select Xcode" step prints what's
    # available so a first failed run tells you immediately.
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode + show SDK
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
          echo "macOS SDK: $(xcrun --sdk macosx --show-sdk-version)"

      - name: Install build tools
        run: |
          brew install xcodegen
          python3 -m pip install --break-system-packages --user dmgbuild
          echo "$HOME/Library/Python/$(python3 -c 'import sys;print(f"{sys.version_info.major}.{sys.version_info.minor}")')/bin" >> "$GITHUB_PATH"

      - name: Import Developer ID certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PWD: ${{ secrets.MACOS_KEYCHAIN_PWD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PWD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application"

      - name: Store notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PWD: ${{ secrets.APPLE_APP_PWD }}
        run: |
          xcrun notarytool store-credentials notary \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PWD" \
            --keychain "$RUNNER_TEMP/build.keychain-db"

      - name: Build, sign, notarize, DMG
        env:
          # package.sh reads the notary profile from this keychain (it's the default keychain now).
          NOTARY_PROFILE: notary
        run: |
          cd dictation
          ./package.sh

      - name: Publish to mac-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "dictation/dist-prod/Just Talk.dmg" "JustTalk.dmg"
          NOTES="Automated build from \`development\` @ ${GITHUB_SHA:0:7} on $(date -u +%Y-%m-%dT%H:%MZ). Apple Silicon · macOS 14+."
          # Recreate the release so its tag tracks the latest commit and the asset is always fresh.
          gh release delete mac-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create mac-latest "JustTalk.dmg" \
            --title "Just Talk — latest Mac build" \
            --notes "$NOTES" \
            --prerelease \
            --target "$GITHUB_SHA"
          echo "Download URL: https://github.com/${GITHUB_REPOSITORY}/releases/download/mac-latest/JustTalk.dmg"
