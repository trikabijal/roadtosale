# Road to Sale v1 — cue pack binding
#
# Purpose: maps voice-engine cue atom IDs to SmartComply template question IDs so the
# ChecklistEngine knows which checklist question a detected cue satisfies.
#
# template_question_id numbering convention:
#   These are the chksQuestions.id values seeded into the Honda US 2026 SmartComply
#   checksheet. Questions are numbered 1–17 in the order they appear in the NADA
#   Road to the Sale process (greet → discovery → vehicle match → walkaround →
#   test drive → trade appraisal → pencil → F&I → close).
#
#   required: true  → this cue MUST fire to count toward question completion
#   required: false → bonus/supporting cue; strengthens detection but not mandatory

entries:

  # ─── Question 1: "Did the salesperson greet the customer within 30 seconds?" ──
  - cue_id: workflow.self_introduction
    template_question_id: 1
    required: true

  - cue_id: workflow.customer_name_use
    template_question_id: 1
    required: false

  # ─── Question 2: "Did the salesperson introduce themselves by name?" ──────────
  - cue_id: workflow.self_introduction
    template_question_id: 2
    required: true

